<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market breach dashboard</title>
<style>
:root{--bg:#0e141b;--panel:#151d27;--line:#232e3b;--tx:#e8edf3;--mut:#8593a3;--good:#3fcf95;--bad:#ff6b6b;--warn:#f2b84b}
*{box-sizing:border-box}
body{margin:0;padding:28px;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-bottom:18px}
h1{flex:1;margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.mut{color:var(--mut)}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--mut)}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{width:100%;min-width:720px;border-collapse:collapse}
th,td{padding:11px 16px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:500;cursor:pointer;user-select:none}
th:hover{color:var(--tx)}
td:first-child{border-left:3px solid transparent}
tr.hit td:first-child{border-left-color:var(--bad)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border:1px solid;border-radius:999px;font-size:12.5px;font-weight:600}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.na{color:var(--mut)}
.pill.good{background:#3fcf9518}.pill.bad{background:#ff6b6b18}.pill.warn{background:#f2b84b18}
.det{display:block;margin-top:2px;color:var(--mut);font-size:12px}
.mkt{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.tile{min-width:170px;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tile .val{margin-right:8px;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
input[type=text],input[type=date]{color-scheme:dark;font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.det.warn{color:var(--warn)}
.tk{color:inherit;text-decoration:none}
.tk:hover{text-decoration:underline}
header a{color:var(--mut);text-decoration:none}
header a:hover{color:var(--tx)}
</style>
</head>
<body>
<header>
  <h1>Market breach dashboard</h1>
  <span id="upd" class="mut"></span>
  <label>As of <input type="date" id="asof"></label><button id="live">Live</button>
  <label><input type="checkbox" id="only"> Show breaches only</label>
  <button id="ref">Refresh data</button>
  <input type="text" id="newsym" placeholder="Add ticker" size="10"><button id="add">Add</button>
  <a href="/settings.html">Settings</a>
</header>
<div class="mkt" id="mkt"></div>
<div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<script>
let D = null, sort = {k: "symbol", d: 1};
const rank = {bad: 0, warn: 1, good: 2, na: 3};
const $ = id => document.getElementById(id);
const val = (r, k) => k === "symbol" ? r.symbol : k === "price" ? r.price : k === "chg" ? r.chg
  : rank[(r.signals[k] || {}).level || "na"];

const TV_IDX = {"^VIX": "CBOE:VIX", "^GSPC": "SP:SPX", "^IXIC": "NASDAQ:IXIC", "^NDX": "NASDAQ:NDX",
  "^DJI": "DJ:DJI", "^RUT": "RUSSELL:RUT", "^TNX": "TVC:US10Y"};
const TV_FUT = {ES: "CME_MINI", NQ: "CME_MINI", RTY: "CME_MINI", YM: "CBOT_MINI", GC: "COMEX", SI: "COMEX",
  HG: "COMEX", CL: "NYMEX", NG: "NYMEX", ZB: "CBOT", ZN: "CBOT"};
function tvSymbol(s) {
  if (TV_IDX[s]) return TV_IDX[s];
  if (s.endsWith("=F")) { const r = s.slice(0, -2); return (TV_FUT[r] ? TV_FUT[r] + ":" : "") + r + "1!"; }
  if (s.endsWith("-USD")) return "COINBASE:" + s.slice(0, -4) + "USD";
  return s.replace("-", ".");
}
const tvLink = (s, text) => `<a class="tk" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(tvSymbol(s))}&interval=D" target="_blank" rel="noopener">${text || s}</a>`;

function render() {
  if (!D) return;
  $("mkt").innerHTML = (D.market || []).map(m =>
    `<div class="tile"><div class="mut">${m.name === "VIX" ? tvLink("^VIX", "VIX") : m.name}</div><div><span class="val">${m.value}</span>`
    + `<span class="pill ${m.level}">${m.label}</span></div><span class="det">${m.detail}</span></div>`).join("");
  const cnt = {};
  D.rows.forEach(r => { if (r.asof) cnt[r.asof] = (cnt[r.asof] || 0) + 1; });
  const ref = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || (a < b ? 1 : -1))[0];
  const cols = D.columns, only = $("only").checked;
  const nBad = c => D.rows.filter(r => (r.signals[c] || {}).flag).length;
  const rows = D.rows
    .filter(r => !only || Object.values(r.signals).some(s => s.level === "bad"))
    .sort((a, b) => { const x = val(a, sort.k), y = val(b, sort.k); return (x > y ? 1 : x < y ? -1 : 0) * sort.d; });
  $("head").innerHTML = `<tr><th data-k="symbol">Ticker</th><th class="num" data-k="price">Price</th><th class="num" data-k="chg">Day</th>`
    + cols.map(c => `<th data-k="${c}">${c} <span class="bad">(${nBad(c)})</span></th>`).join("") + `</tr>`;
  $("body").innerHTML = rows.map(r => {
    const hit = Object.values(r.signals).some(s => s.level === "bad");
    const cells = cols.map(c => {
      const s = r.signals[c] || {level: "na", label: "–", detail: ""};
      return `<td><span class="pill ${s.level}">${s.label}</span><span class="det">${s.detail}</span></td>`;
    }).join("");
    return `<tr class="${hit ? "hit" : ""}"><td><b>${tvLink(r.symbol)}</b> <span class="mut">${r.name || ""}</span></td>`
      + `<td class="num">${r.price ?? "–"}<span class="det ${r.asof < ref ? "warn" : ""}">${r.asof ? r.asof + (r.asof < ref ? " (old)" : "") : ""}</span></td>`
      + `<td class="num ${r.chg >= 0 ? "good" : "bad"}">${r.chg == null ? "" : r.chg.toFixed(2) + "%"}</td>${cells}</tr>`;
  }).join("");
}

async function load() {
  const d = $("asof").value;
  D = await (await fetch("/api/data" + (d ? "?asof=" + d : ""))).json();
  $("upd").textContent = !D.updated ? "Loading first data…"
    : d ? "History as of " + d + " (latest bar on or before that date)"
    : "Updated " + new Date(D.updated).toLocaleString();
  if (!D.updated) setTimeout(load, 5000);
  render();
}

$("head").onclick = e => {
  const k = e.target.closest("th")?.dataset.k;
  if (k) { sort = sort.k === k ? {k, d: -sort.d} : {k, d: 1}; render(); }
};
$("add").onclick = async () => {
  const sym = $("newsym").value.trim().toUpperCase();
  if (!sym) return;
  const cfg = await (await fetch("/api/config")).json();
  if (!cfg.tickers.some(t => t.symbol === sym)) cfg.tickers.push({symbol: sym, name: ""});
  const r = await fetch("/api/config", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(cfg)});
  if (!r.ok) { alert("Could not add " + sym + ". Use letters, digits, and . - ^ = / only."); return; }
  $("newsym").value = "";
  $("upd").textContent = "Fetching " + sym + "…";
  setTimeout(load, 15000);
};
$("newsym").onkeydown = e => { if (e.key === "Enter") $("add").click(); };
$("asof").onchange = load;
$("live").onclick = () => { $("asof").value = ""; load(); };
$("only").onchange = render;
$("ref").onclick = async () => { await fetch("/api/refresh", {method: "POST"}); setTimeout(load, 15000); };
load();
setInterval(load, 60000);
</script>
</body>
</html>
